<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>會計大富翁</title>
<style>
:root{--cream:#fffaf0;--paper:#fff;--blue:#dbeafe;--blue2:#93c5fd;--navy:#1e3a5f;--gold:#d4a017;--gold2:#fde68a;--ink:#25324a;--ok:#2f855a;--bad:#c0392b;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#fffaf0;--ink:#25324a}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
header{text-align:center;padding:14px 8px 4px}
h1{margin:0;font-size:clamp(22px,4vw,32px);color:var(--navy);letter-spacing:.08em}
h1 span{color:var(--gold)}
main{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:10px;max-width:1100px;margin:auto}
#board{position:relative;width:min(100%,640px);aspect-ratio:1/1.05;background:linear-gradient(#bfe0ff,#fff4d6);border-radius:18px;border:3px solid var(--gold);overflow:hidden}
#board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.cell{background:var(--paper);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(9px,1.8vw,12px);position:relative;border:1px solid var(--blue2);text-align:center;line-height:1.2;min-width:0}
.cell b{font-size:clamp(14px,3vw,22px);font-weight:400}
.cell.start{background:var(--gold2)}.cell.bonus{background:#fff4c2}.cell.event{background:#eaf3ff}.cell.rest{background:#f1f5f9}
.cell.cur{outline:3px solid var(--gold);z-index:1}
.pawns{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.pawn{width:clamp(11px,2.4vw,17px);height:clamp(11px,2.4vw,17px);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--navy)}
#center{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;background:rgba(255,250,240,.93);border:2px solid var(--blue);border-radius:14px;padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;text-align:center}
#center #info{font-size:13px}#center #msg{flex:1 1 100%;order:5}
#dice{font-size:clamp(30px,6vw,40px);line-height:1}
#msg{font-size:clamp(11px,2.2vw,14px);min-height:2.8em;max-width:95%}
button{font:inherit;cursor:pointer;border-radius:999px;border:2px solid var(--navy);background:var(--gold2);color:var(--navy);padding:6px 16px;font-weight:700}
button:hover:not(:disabled){background:var(--gold)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
button.ghost{background:var(--paper);padding:3px 12px;font-size:12px}
aside{flex:1 1 280px;max-width:420px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:2px solid var(--blue);border-radius:14px;padding:10px 12px}
.card h2{font-size:15px;margin:0 0 6px;color:var(--navy)}
.pl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:6px;border-radius:10px;margin-bottom:4px;font-size:13px}
.pl.on{background:var(--gold2)}.pl .dot{width:14px;height:14px;border-radius:50%;margin-top:4px}
#log{max-height:150px;overflow:auto;font-size:12px;padding-left:16px;margin:0}
#modal{position:fixed;inset:0;background:rgba(30,58,95,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal.show{display:flex}
.box{background:var(--cream);border:3px solid var(--gold);border-radius:18px;padding:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.box h3{margin:0 0 8px;color:var(--navy)}
.tag{display:inline-block;background:var(--blue);border-radius:99px;padding:0 10px;font-size:12px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--paper);border-color:var(--blue2);font-weight:400}
.opt.right{background:#c6f6d5;border-color:var(--ok)}.opt.wrong{background:#fed7d7;border-color:var(--bad)}
.rp{width:100%;border-collapse:collapse;font-size:12px}.rp td,.rp th{border:1px solid var(--blue2);padding:3px 4px;text-align:center}
.sel{background:var(--gold)!important}
.opt.right,.opt.wrong{opacity:1}
details.exp summary{cursor:pointer;font-weight:700}
.exp{background:var(--blue);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
@media (prefers-reduced-motion:no-preference){#dice.spin{animation:sp .4s}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<header><h1>會計<span>大富翁</span></h1><button class="ghost" id="musicBtn">🎵 音樂：開</button><div style="font-size:12px">拖曳可旋轉視角，滾輪可縮放</div></header>
<main>
  <div id="board"><div id="center">
    <div id="info"></div><div id="dice">🎲</div><div id="msg"></div>
    <button id="rollBtn">擲骰子</button>
    <button class="ghost" id="restartBtn">重新開始</button>
  </div></div>
  <aside>
    <div class="card"><h2>玩家狀態 <button class="ghost" id="reportBtn" style="float:right">📊 學習報告</button></h2><div id="players"></div></div>
    <div class="card"><h2>遊戲紀錄</h2><ol id="log" reversed></ol></div>
  </aside>
</main>
<div id="modal"><div class="box" id="box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================
   題庫資料層：只放資料與驗證，不含遊戲規則或畫面。
   - 新增章節（例如高等會計）：在 TOPICS 加一筆 {id,name,chapter}。
   - 新增題目：在 QUESTION_BANK 加物件，或呼叫 Bank.addQuestions([...])。
   - source（教材來源）目前刻意留空，待 RAG 教材接上後再填，不自行編造。
   - 未來 RAG 產生的題目請輸出同樣的欄位格式。
   ========================================================== */
const TOPICS=[
 {id:"asset",name:"資產",chapter:"基礎會計"},
 {id:"liability",name:"負債",chapter:"基礎會計"},
 {id:"equity",name:"權益",chapter:"基礎會計"},
 {id:"revenue",name:"收入",chapter:"基礎會計"},
 {id:"expense",name:"費用",chapter:"基礎會計"},
 {id:"dc",name:"借貸分錄",chapter:"基礎會計"},
 {id:"statements",name:"財務報表",chapter:"基礎會計"},
 {id:"inventory",name:"存貨",chapter:"存貨單元"}
];
const QUESTION_BANK=[
 {"id": "Q001", "topic": "asset", "question": "下列哪一項屬於資產？", "options": ["現金", "應付帳款", "業主資本", "水電費"], "answer": 0, "explanation": "現金是企業擁有、可帶來未來經濟效益的資源，屬於資產。", "source": ""},
 {"id": "Q002", "topic": "liability", "question": "「應付帳款」屬於哪一類會計項目？", "options": ["資產", "負債", "收入", "費用"], "answer": 1, "explanation": "應付帳款是賒購後尚未支付的義務，屬於負債。", "source": ""},
 {"id": "Q003", "topic": "equity", "question": "資產總額 100 萬、負債 40 萬，依會計等式，權益為多少？", "options": ["140 萬", "40 萬", "60 萬", "100 萬"], "answer": 2, "explanation": "資產 = 負債 + 權益，所以權益 = 100 − 40 = 60 萬。", "source": ""},
 {"id": "Q004", "topic": "revenue", "question": "公司提供服務並收到現金，會使哪個項目增加？", "options": ["費用", "收入", "負債", "業主提取"], "answer": 1, "explanation": "因提供服務而賺得報酬，屬於收入增加（同時現金增加）。", "source": ""},
 {"id": "Q005", "topic": "expense", "question": "支付本月辦公室水電費，屬於哪一類？", "options": ["資產", "負債", "費用", "權益增資"], "answer": 2, "explanation": "水電費是為經營而耗用的支出，列為費用。", "source": ""},
 {"id": "Q006", "topic": "dc", "question": "資產類科目增加時，應記在哪一方？", "options": ["借方", "貸方", "兩邊都可", "都不用記"], "answer": 0, "explanation": "資產的正常餘額在借方，增加記借方、減少記貸方。", "source": ""},
 {"id": "Q007", "topic": "dc", "question": "負債類科目增加時，應記在哪一方？", "options": ["借方", "貸方", "借貸對沖", "不必記錄"], "answer": 1, "explanation": "負債的正常餘額在貸方，增加記貸方。", "source": ""},
 {"id": "Q008", "topic": "asset", "question": "預先支付下個月的租金，在支付當下屬於？", "options": ["費用", "負債", "收入", "資產（預付費用）"], "answer": 3, "explanation": "預付租金尚未耗用，代表未來可使用的權利，先記為資產。", "source": ""},
 {"id": "Q009", "topic": "liability", "question": "客戶先付款但公司尚未提供商品，這筆「預收款項」屬於？", "options": ["收入", "負債", "資產", "費用"], "answer": 1, "explanation": "公司有義務日後提供商品或服務，因此是負債，履約後才轉為收入。", "source": ""},
 {"id": "Q010", "topic": "equity", "question": "業主再投入現金到公司，會使哪個項目增加？", "options": ["負債", "收入", "權益", "費用"], "answer": 2, "explanation": "業主投資使業主權益（資本）增加，同時現金增加。", "source": ""},
 {"id": "Q011", "topic": "revenue", "question": "淨利的計算方式為何？", "options": ["收入 − 費用", "資產 − 負債", "收入 + 費用", "負債 − 權益"], "answer": 0, "explanation": "淨利 = 收入 − 費用；資產 − 負債則是權益。", "source": ""},
 {"id": "Q012", "topic": "asset", "question": "「應收帳款」代表什麼？", "options": ["欠供應商的錢", "客戶尚未支付的款項", "已預收的款項", "業主提取的金額"], "answer": 1, "explanation": "應收帳款是賒銷後向客戶收款的權利，屬於資產。", "source": ""},
 {"id": "Q013", "topic": "equity", "question": "業主從公司提取現金供個人使用，對權益的影響是？", "options": ["增加", "減少", "沒有影響", "變成收入"], "answer": 1, "explanation": "業主提取會減少業主權益，同時現金減少。", "source": ""},
 {"id": "Q014", "topic": "dc", "question": "賒銷商品一批，分錄中應借記哪個科目？", "options": ["銷貨收入", "應付帳款", "應收帳款", "現金流量"], "answer": 2, "explanation": "賒銷：借記「應收帳款」（資產增加），貸記「銷貨收入」（收入增加）。", "source": ""},
 {"id": "Q015", "topic": "statements", "question": "試算表的主要目的是檢查什麼？", "options": ["利潤是否最大", "借方總額是否等於貸方總額", "現金是否足夠", "稅額是否正確"], "answer": 1, "explanation": "複式簿記每筆分錄借貸相等，試算表用來檢查借貸總額是否平衡。", "source": ""},
 {"id": "Q016", "topic": "expense", "question": "提列「折舊費用」時，通常有什麼特性？", "options": ["當期立即付出現金", "屬於收入", "是成本分攤、不一定當下付現", "會增加資產"], "answer": 2, "explanation": "折舊是把固定資產成本分攤到各期，屬於費用，不涉及當期現金支出。", "source": ""},
 {"id": "Q017", "topic": "revenue", "question": "依權責發生制，收入應在何時認列？", "options": ["收到現金時", "賺得（履約）時", "簽約前", "年底統一認列"], "answer": 1, "explanation": "權責發生制重視經濟事項發生，收入於賺得時認列，不以收現為準。", "source": ""},
 {"id": "Q018", "topic": "statements", "question": "資產負債表反映的是什麼？", "options": ["一段期間的經營成果", "某一特定時點的財務狀況", "現金收支預測", "稅務申報"], "answer": 1, "explanation": "資產負債表呈現某一時點的資產、負債與權益；一段期間的成果看損益表。", "source": ""},
 {"id": "Q019", "topic": "statements", "question": "損益表（綜合損益表）主要報導什麼？", "options": ["某一時點的資產", "一段期間的收入、費用與損益", "業主個人財產", "銀行存款餘額"], "answer": 1, "explanation": "損益表彙總一段期間的收入與費用，計算出本期損益。", "source": ""},
 {"id": "Q020", "topic": "liability", "question": "已提供勞務但尚未發放的員工薪資，應記為？", "options": ["預付費用", "應付薪資（負債）", "收入", "資產"], "answer": 1, "explanation": "公司已有付款義務，屬於負債（應付薪資），同時認列薪資費用。", "source": ""},
 {"id": "Q021", "topic": "expense", "question": "下列哪一項「不屬於」費用？", "options": ["支付員工薪資", "支付辦公室租金", "購買一台電腦設備", "支付本月水電費"], "answer": 2, "explanation": "購買電腦設備是取得可長期使用的資源，應記為資產（固定資產），之後再以折舊費用分攤到各期；薪資、租金、水電費都是當期為經營而耗用的支出，屬於費用。", "source": ""},
 {"id": "Q022", "topic": "expense", "question": "費用增加時，對業主權益的影響為何？", "options": ["使權益增加", "使權益減少", "沒有任何影響", "使負債減少"], "answer": 1, "explanation": "費用會減少本期損益，期末結轉後使權益減少，所以費用增加，權益就相對減少（費用的正常餘額在借方）。", "source": ""}
];
const Bank=(()=>{
 const topics=new Map(),qs=[],errors=[];
 const check=q=>{const e=[];
  if(!q.id)e.push("缺少 id");
  if(!topics.has(q.topic))e.push("未知主題："+q.topic);
  if(!q.question)e.push("缺少題目");
  if(!Array.isArray(q.options)||q.options.length!==4||new Set(q.options).size!==4)e.push("需要 4 個不重複的選項");
  if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3)e.push("answer 必須是 0~3");
  if(!q.explanation)e.push("缺少解析");
  if(typeof q.source!=="string")e.push("source 必須是字串（可為空）");
  return e};
 const api={
  errors,
  addTopic(t){topics.set(t.id,t)},
  addQuestions(list){let n=0;list.forEach(q=>{const e=check(q);if(qs.some(x=>x.id===q.id))e.push("id 重複");
   if(e.length){errors.push(`${q.id||"(無id)"}：${e.join("、")}`);console.error("題庫錯誤",q.id,e)}else{qs.push(q);n++}});return n},
  topics:()=>[...topics.values()],
  topicName:id=>topics.has(id)?topics.get(id).name:id,
  all:()=>qs,
  byTopic:id=>qs.filter(q=>q.topic===id),
  // 匯入 RAG/外部產生的 JSON：可以是題目陣列，或 {"topics":[...],"questions":[...]}。逐題驗證，通過才加入。
  importJSON(text){let d;try{d=JSON.parse(text)}catch(e){return{added:0,errors:["JSON 格式錯誤："+e.message]}}
   const list=Array.isArray(d)?d:(d&&d.questions)||[];
   if(!Array.isArray(list)||!list.length)return{added:0,errors:["找不到題目（需要陣列，或含 questions 的物件）"]};
   ((d&&d.topics)||[]).forEach(t=>{if(t&&t.id&&t.name&&!topics.has(t.id))api.addTopic({id:t.id,name:t.name,chapter:t.chapter||""})});
   const before=errors.length;list.forEach(q=>{if(q&&q.source===undefined)q.source=""});
   const added=api.addQuestions(list.filter(q=>q&&typeof q==="object"));return{added,errors:errors.slice(before)}}
 };
 TOPICS.forEach(api.addTopic);api.addQuestions(QUESTION_BANK);return api})();
</script>
<script>
/* ========== 模組 1：事件資料 ========== */
const EVENTS = [
 {t:"銷貨收入入帳：本期收入增加！",c:40},{t:"支付租金：費用增加、現金減少。",c:-20},
 {t:"取得銀行借款：現金與負債同時增加。",c:30},{t:"收回應收帳款：資產內部轉換。",c:25},
 {t:"繳納水電費：營業費用增加。",c:-15},{t:"業主增資：權益增加。",c:40},
 {t:"提列設備折舊：費用增加。",c:-10},{t:"收到利息收入。",c:20}
];

/* ========== 模組 2：遊戲狀態與規則（不含畫面操作） ========== */
const LEVELS={easy:{name:"簡單",acc:.35},normal:{name:"普通",acc:.6},hard:{name:"困難",acc:.85}};
let LEVEL="normal";
const CFG = {cells:24,maxRounds:10,reward:30,lapBonus:20,bonusCell:50,startCoins:100,total:4,landV:50,houseV:40,toll:20,tollHouse:20,houseCost:40,maxHouse:3,hospFee:20};
const BOARD = ["start","quiz","quiz","event","quiz","bonus","rest","quiz","event","quiz","quiz","bonus",
               "rest","quiz","event","quiz","quiz","bonus","quiz","event","quiz","rest","quiz","event"];
const COLORS = ["#e11d48","#2563eb","#16a34a","#9333ea"];
const ICON = {start:"🏁",quiz:"📘",event:"📰",bonus:"🪙",rest:"☕"};
const NAME = {start:"起點",quiz:"會計問答",event:"會計事件",bonus:"獎勵",rest:"休息"};
let S = null;
const Game = {
  create(humans,level="normal"){
    S = {players:Array.from({length:CFG.total},(_,i)=>({id:i,name:i<humans?`玩家${i+1}`:`電腦${i-humans+1}`,cpu:i>=humans,skill:i>=humans?Math.max(.05,Math.min(.95,LEVELS[level].acc+(Math.random()-.5)*.1)):1,
      pos:0,coins:CFG.startCoins,ok:0,tot:0,skip:false,hosp:false,stats:{},hist:[]})),cur:0,round:1,used:[],busy:false,over:false,logs:[],level,owner:Array(24).fill(-1),house:Array(24).fill(0),block:Array(24).fill(-1),placed:false};
  },
  pickQuestion(){
    const all=Bank.all(); if(S.used.length>=all.length) S.used=[];
    let i; do{i=Math.floor(Math.random()*all.length)}while(S.used.includes(i));
    S.used.push(i);
    const b=all[i], idx=[0,1,2,3];
    for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]]}
    return {id:b.id,topic:b.topic,question:b.question,options:idx.map(k=>b.options[k]),answer:idx.indexOf(b.answer),explanation:b.explanation,source:b.source}; // 選項洗牌，答案索引同步更新
  },
  cpuChoice(p,q){ // 電腦作答：以 p.skill 的機率答對；答錯時從三個錯誤選項中隨機選
    if(Math.random()<p.skill)return q.answer;
    const w=[0,1,2,3].filter(i=>i!==q.answer);return w[Math.floor(Math.random()*3)];
  },
  grade(p,q,choice){ // 計分與紀錄：總數、各主題、作答歷程
    const ok=choice===q.answer; p.tot++;
    const s=p.stats[q.topic]||(p.stats[q.topic]={ok:0,tot:0}); s.tot++;
    if(ok){p.ok++;s.ok++;p.coins+=CFG.reward}
    p.hist.push({id:q.id,topic:q.topic,choice,ok,round:S.round});
    return ok;
  },
  acc(p){ return p.tot?Math.round(p.ok/p.tot*100)+"%":"—" },

  $("info").innerHTML=`<b>第 ${Math.min(S.round,CFG.maxRounds)} / ${CFG.maxRounds} 回合</b><br>輪到：${p.name}　位置：${p.pos} 號（${NAME[BOARD[p.pos]]}）<br>🚧 路障：${S.block.map((b,i)=>b>=0?i:"").filter(x=>x!=="").join("、")||"無"}`;
  $("players").innerHTML=S.players.map(q=>`<div class="pl ${q.id===S.cur?"on":""}"><span style="font-size:24px;line-height:1.2">${ANIMAL[q.id]}</span>
    <div><b>${q.name}</b>${q.cpu?"（電腦）":""}　🪙 ${q.coins}<br>位置 ${q.pos}${q.hosp?"（住院）":""}　🚩${S.owner.filter(o=>o===q.id).length}　🏠${S.owner.reduce((s,o,i)=>o===q.id?s+S.house[i]:s,0)}　答對 ${q.ok}／答錯 ${q.tot-q.ok} 題　正確率 ${Game.acc(q)}</div></div>`).join("");
}
function modal(html){$("box").innerHTML=html;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
function waitBtn(id){return new Promise(r=>$(id).onclick=r)}

function loadImports(){try{JSON.parse(localStorage.getItem("acc_imports")||"[]").forEach(t=>Bank.importJSON(t))}catch(e){}}
function saveImport(t){try{const a=JSON.parse(localStorage.getItem("acc_imports")||"[]");a.push(t);localStorage.setItem("acc_imports",JSON.stringify(a))}catch(e){}}
function showImport(){
  modal(`<h3>📥 匯入題庫（JSON）</h3><p style="font-size:13px">貼上 RAG 匯出的 JSON。每題逐一檢查，通過的才會加入；匯入的題目會保存在這個瀏覽器中。目前題庫共 <span id="impN">${Bank.all().length}</span> 題。</p>
  <textarea id="impTxt" style="width:100%;height:150px;font-size:12px" placeholder='[{"id":"INV001","topic":"inventory","question":"…","options":["…","…","…","…"],"answer":0,"explanation":"…","source":""}]'></textarea>
  <div id="impMsg" style="font-size:13px;margin-top:6px"></div>
  <div class="row"><button id="impGo">檢查並匯入</button><button class="ghost" id="impClr">清除已匯入的題目</button><button class="ghost" id="impX">返回</button></div>`);
  $("impGo").onclick=()=>{const t=$("impTxt").value,r=Bank.importJSON(t);if(r.added)saveImport(t);$("impN").textContent=Bank.all().length;
    $("impMsg").innerHTML=`✅ 成功加入 ${r.added} 題。`+(r.errors.length?`<br>❌ ${r.errors.length} 項未通過：<br>${r.errors.map(esc).join("<br>")}`:"")};
  $("impClr").onclick=()=>{try{localStorage.removeItem("acc_imports")}catch(e){}$("impMsg").textContent="已清除保存的匯入題目，重新整理頁面後恢復為內建題庫。"};
  $("impX").onclick=startScreen;
}
function startScreen(){
  S=null; $("rollBtn").disabled=true;
  modal(`<h3>歡迎來到會計大富翁</h3><p style="font-size:14px">共 4 位玩家，其餘由電腦擔任，進行 ${CFG.maxRounds} 回合。<br>🚩 答對問答格就佔領土地並直接蓋好水上別墅，別人經過要付過路費（答對可減半）。<br>🏠 每格一半是步道、一半是水上別墅用地；回到自己的土地可花 40 金幣加蓋升級（最高 3 級），過路費更高。<br>🚧 每回合開始會隨機冒出路障，撞到的人由漁夫駕船送醫院。<br>最後比「資產總額」＝現金＋土地＋房屋。</p>
  <p style="text-align:center;margin:8px 0 2px;font-size:13px">電腦難度（答對機率約：簡單 35%／普通 60%／困難 85%）</p><div class="row">${Object.entries(LEVELS).map(([k,v])=>`<button class="ghost${k===LEVEL?" sel":""}" data-l="${k}">${v.name}</button>`).join("")}</div><div class="row">${[1,2,3,4].map(n=>`<button data-n="${n}">${n} 位真人</button>`).join("")}</div><p style="font-size:13px;text-align:center">題庫目前共 ${Bank.all().length} 題　<button class="ghost" id="impOpen">📥 匯入題庫</button></p>`);$("impOpen").onclick=showImport;
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{LEVEL=b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("sel",x===b))});
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>begin(+b.dataset.n));
}
function begin(n){ SND.start(); closeModal(); Game.create(n,LEVEL); buildBoard(); $("log").innerHTML=""; $("dice").textContent="🎲"; render(); log("遊戲開始！"); randomBlock(); turn(); }

async function turn(){
  if(!S||S.over)return; const g=S, p=S.players[S.cur]; S.placed=false; render();
  if(p.hosp){msg(`${p.name} 住院休養中…`);await sleep(600);if(g!==S)return;await ferry(p,false);if(g!==S)return;log(`${p.name} 出院，由漁夫送回岸邊。`);return endTurn();}
  if(p.skip){p.skip=false;log(`${p.name} 休息一次，跳過本回合。`);msg(`${p.name} 休息中…`);await sleep(900);return g===S?endTurn():0;}
  if(p.cpu){msg(`${p.name} 思考中…`);$("rollBtn").disabled=true;await sleep(800);return g===S?roll():0;}
  msg(`${p.name}，請擲骰子！`);$("rollBtn").disabled=false;
}
async function roll(){
  if(!S||S.busy||S.over)return; S.busy=true;$("rollBtn").disabled=true;
  const g=S, p=S.players[S.cur], d=1+Math.floor(Math.random()*6);
  const dEl=$("dice");dEl.classList.remove("spin");void dEl.offsetWidth;dEl.classList.add("spin");dEl.textContent="⚀⚁⚂⚃⚄⚅"[d-1];
  msg(`${p.name} 擲出 ${d} 點`);SND.sfx("roll");await sleep(500);
  for(let i=0;i<d;i++){ p.pos=(p.pos+1)%CFG.cells; if(p.pos===0){p.coins+=CFG.lapBonus;log(`${p.name} 經過起點，獲得 ${CFG.lapBonus} 金幣。`)} render(); SND.sfx("tick"); await sleep(230); if(g!==S)return;
    if(S.block[p.pos]>=0&&S.block[p.pos]!==p.id){await hitBlock(p);if(g!==S)return;S.busy=false;return endTurn()} }
  await resolveCell(p); if(g!==S)return;
  S.busy=false; endTurn();
}
async function resolveCell(p){
  const g=S,t=BOARD[p.pos];
  if(t==="quiz"){
    const q=Game.pickQuestion();let ok;
    ok=p.cpu?await askCpu(p,q):await askHuman(p,q);
    if(g!==S)return;await landRules(p,ok);
  }else if(t==="event"){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    p.coins=Math.max(0,p.coins+ev.c);log(`${p.name}：${ev.t}（${ev.c>0?"+":""}${ev.c}）`);
    if(p.cpu){msg(ev.t);await sleep(1000);}else{modal(`<h3>📰 會計事件</h3><p>${ev.t}</p><p><b>${ev.c>0?"+":""}${ev.c} 金幣</b></p><div class="row"><button id="go">繼續</button></div>`);await waitBtn("go");closeModal();}
  }else if(t==="bonus"){
    p.coins+=CFG.bonusCell;SND.sfx("good");log(`${p.name} 踩到獎勵格，+${CFG.bonusCell} 金幣。`);msg(`${p.name} 獲得 ${CFG.bonusCell} 金幣！`);await sleep(900);
  }else if(t==="rest"){
    p.skip=true;log(`${p.name} 踩到休息格，下一輪暫停。`);msg(`${p.name} 休息一下 ☕`);await sleep(900);
  }
  if(g===S)render();
}
async function askHuman(p,q){
  modal(`<span class="tag">${Bank.topicName(q.topic)}</span><h3>${q.question}</h3>${q.options.map((x,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${x}</button>`).join("")}<div id="fb"></div>`);
  const choice=await new Promise(r=>document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>r(+b.dataset.i)));
  const ok=Game.grade(p,q,choice);SND.sfx(ok?"good":"bad");
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("right");else if(i===choice)b.classList.add("wrong")});
  const f=Explain.full(q,choice);
  $("fb").innerHTML=`<div class="exp"><b>${ok?`🎉 答對了！+${CFG.reward} 金幣`:"❌ 答錯了"}</b><br>正確答案：${f.correct}${ok?"":`<br>你選的是：${f.yours}`}<br><br><b>觀念解析：</b>${f.explanation}${srcLine(f.source)}</div>`
   +(ok?"":`<details id="rag" class="exp"><summary>🔎 查看詳細解釋</summary><div id="ragBody">載入中…</div></details>`)+`<div class="row"><button id="go">繼續</button></div>`;
  if(!ok){const d=$("rag");d.ontoggle=async()=>{if(!d.open||d.dataset.done)return;d.dataset.done=1;const r=await Explain.detail(q,choice);
   $("ragBody").innerHTML=r.connected?r.passages.map(x=>`<p>${esc(x.text)}<br><small>${esc(x.source||"")}</small></p>`).join(""):"尚未連接 RAG 教材檢索。這裡之後會顯示與這題相關的教材段落與出處；目前只有上方的內建解析。"}}
  log(`${p.name} 回答「${Bank.topicName(q.topic)}」題：${ok?`答對 +${CFG.reward}`:"答錯"}。`);render();
  await waitBtn("go");closeModal();return ok;
}
function srcLine(s){ // 顯示用：隱藏內部文件代碼（如 doc_001_part1）與重複字樣；資料本身不變
  if(!s)return `<br><small>教材來源：（尚未提供）</small>`;
  const ps=s.split("｜").map(x=>x.trim()).filter(x=>x&&!/^doc_\d+_part\d+$/i.test(x));
  const u=ps.filter((x,i)=>ps.indexOf(x)===i&&!ps.some((y,j)=>j!==i&&y.length>x.length&&y.includes(x)));
  return u.length?`<br><small>教材來源：${esc(u.join("｜"))}</small>`:"";
}
async function askCpu(p,q){
  const g=S;
  modal(`<span class="tag">${Bank.topicName(q.topic)}</span> <span class="tag">🤖 ${esc(p.name)} 作答中…</span><h3>${q.question}</h3>${q.options.map((x,i)=>`<button class="opt" disabled>${"ABCD"[i]}. ${x}</button>`).join("")}<div id="fb"></div>`);
  msg(`${p.name} 思考中…`);await sleep(1600);if(g!==S)return false;
  const choice=Game.cpuChoice(p,q),ok=Game.grade(p,q,choice);SND.sfx(ok?"good":"bad");
  document.querySelectorAll(".opt").forEach((b,i)=>{if(i===q.answer)b.classList.add("right");else if(i===choice)b.classList.add("wrong")});
  const f=Explain.full(q,choice);
  $("fb").innerHTML=`<div class="exp"><b>🤖 ${esc(p.name)} 選了 ${f.yours}：${ok?`答對了！+${CFG.reward} 金幣`:"答錯了"}</b><br>正確答案：${f.correct}<br><br><b>觀念解析：</b>${f.explanation}${srcLine(f.source)}</div><div class="row"><button id="go">繼續（5 秒後自動繼續）</button></div>`;
  log(`${p.name} 回答「${Bank.topicName(q.topic)}」題：${ok?`答對 +${CFG.reward}`:"答錯"}。`);render();
  await Promise.race([waitBtn("go"),sleep(5000)]);
  if(g===S)closeModal();return ok;
}
function reportHTML(){
  const ps=S.players,ts=Bank.topics(),pct=s=>s&&s.tot?`${s.ok}/${s.tot}（${Math.round(s.ok/s.tot*100)}%）`:"—";
  const weak=ps.filter(p=>!p.cpu).map(p=>{const w=ts.filter(t=>p.stats[t.id]&&p.stats[t.id].tot).sort((a,b)=>p.stats[a.id].ok/p.stats[a.id].tot-p.stats[b.id].ok/p.stats[b.id].tot)[0];
   return w&&p.stats[w.id].ok<p.stats[w.id].tot?`${ANIMAL[p.id]} 建議複習：${w.name}`:""}).filter(Boolean).join("　");
  return `<table class="rp"><tr><th>主題</th>${ps.map(p=>`<th>${ANIMAL[p.id]}</th>`).join("")}</tr>`
   +ts.map(t=>`<tr><td>${t.name}</td>${ps.map(p=>`<td>${pct(p.stats[t.id])}</td>`).join("")}</tr>`).join("")
   +`<tr><td><b>答對／答錯</b></td>${ps.map(p=>`<td><b>${p.ok}／${p.tot-p.ok}</b></td>`).join("")}</tr></table>${weak?`<p style="font-size:13px">${weak}</p>`:""}`;
}
function showReport(){
  if(!S||S.busy||S.over||S.players[S.cur].cpu)return;
  modal(`<h3>📊 學習報告</h3><div style="overflow-x:auto">${reportHTML()}</div><div class="row"><button id="rc">關閉</button></div>`);$("rc").onclick=closeModal;
}
async function note(p,t){log(t);if(p.cpu){msg(t);await sleep(1100)}else{modal(`<h3>${t}</h3><div class="row"><button id="go">繼續</button></div>`);await waitBtn("go");closeModal()}}
function askBuild(p){const i=p.pos;modal(`<h3>🏠 要升級別墅嗎？</h3><p>在自己的 ${i} 號土地加蓋升級需 ${CFG.houseCost} 金幣（目前 Lv.${S.house[i]}）。房屋是資產，也會讓過路費增加 ${CFG.tollHouse}。</p><div class="row"><button id="yes">升級</button><button class="ghost" id="no">不用了</button></div>`);return new Promise(r=>{$("yes").onclick=()=>{closeModal();r(true)};$("no").onclick=()=>{closeModal();r(false)}})}
async function landRules(p,ok){
  const i=p.pos,o=S.owner[i];
  if(o<0){if(ok){S.owner[i]=p.id;S.house[i]=1;render();await note(p,`🚩 ${p.name} 佔領了 ${i} 號土地，並直接蓋好水上別墅！`)}}
  else if(o!==p.id){const ow=S.players[o];let fee=CFG.toll+S.house[i]*CFG.tollHouse;if(ok)fee=Math.ceil(fee/2);fee=Math.min(fee,p.coins);p.coins-=fee;ow.coins+=fee;render();
    await note(p,`💸 ${p.name} 經過 ${ow.name} 的土地，付過路費 ${fee}${ok?"（答對減半）":""}。地主記收入、付款者記費用。`)}
  else if(S.house[i]<CFG.maxHouse&&p.coins>=CFG.houseCost){
    const yes=p.cpu?Math.random()<.6:await askBuild(p);
    if(yes){p.coins-=CFG.houseCost;S.house[i]++;render();await note(p,`🏠 ${p.name} 把 ${i} 號土地的別墅升到 Lv.${S.house[i]}。`)}
  }
}
function randomBlock(){
  if(S.block.filter(b=>b>=0).length>=4)return;
  const ok=[...Array(CFG.cells).keys()].filter(i=>i>0&&S.block[i]<0&&!S.players.some(q=>q.pos===i&&!q.hosp));
  if(!ok.length)return;const i=ok[Math.floor(Math.random()*ok.length)];
  S.block[i]=9;log(`🚧 本回合隨機出現路障：${i} 號格！`);render();
}
async function hitBlock(p){
  const g=S;S.block[p.pos]=-1;T3.sync();SND.sfx("bad");
  await note(p,`🚧 ${p.name} 撞上路障受傷了！漁夫駕船來接，送往醫院。`);if(g!==S)return;
  await ferry(p,true);if(g!==S)return;
  p.coins=Math.max(0,p.coins-CFG.hospFee);render();log(`${p.name} 住院，支付醫療費 ${CFG.hospFee}（屬於費用）。`);
}
async function ferry(p,toHosp){
  const g=S,T=T3,tp=T.pos(p.pos),ap=T.approach(Math.atan2(tp.z,tp.x));
  if(toHosp){await T.sail(T.route(T.boat.position,ap));if(g!==S)return;T.rider=p.id;await T.sail(T.route(ap,T.D));if(g!==S)return;p.hosp=true;T.rider=-1;T.sync();await T.sail([T.D])}
  else{await T.sail(T.route(T.boat.position,T.D));if(g!==S)return;T.rider=p.id;await T.sail(T.route(T.D,ap));if(g!==S)return;p.hosp=false;T.rider=-1;T.sync();await T.sail(T.route(ap,T.D))}
}
function endTurn(){
  if(!S)return; S.cur=(S.cur+1)%S.players.length;
  if(S.cur===0)S.round++;
  if(S.round>CFG.maxRounds)return finish();
  if(S.cur===0)randomBlock();
  turn();
}
function finish(){
  S.over=true;$("rollBtn").disabled=true;render();
  const r=Game.ranking();
  modal(`<h3>🏆 遊戲結算</h3><p>${r[0].name} 以資產總額 ${Game.worth(r[0])} 獲勝！</p><p style="font-size:13px">資產總額 = 現金 + 土地（${CFG.landV}／塊）+ 房屋（${CFG.houseV}／棟）</p>
  ${r.map((p,i)=>`<div class="pl"><b>${i+1}</b><div>${p.name}　🪙 ${p.coins}　資產 ${Game.worth(p)}<br>答對 ${p.ok}／答錯 ${p.tot-p.ok} 題　正確率 ${Game.acc(p)}</div></div>`).join("")}
  <h3 style="margin-top:12px">📊 學習報告</h3><div style="overflow-x:auto">${reportHTML()}</div><div class="row"><button id="again">再玩一次</button></div>`);
  $("again").onclick=startScreen;
}
$("rollBtn").onclick=()=>{ if(S&&!S.players[S.cur].cpu)roll() };
$("restartBtn").onclick=()=>{ if(!S||S.over||confirm("確定要重新開始嗎？"))startScreen(); };
$("musicBtn").onclick=()=>SND.toggle();
$("reportBtn").onclick=showReport;
buildBoard();
loadImports();
startScreen();
</script>
</body>
</html>
